<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Billing History | Inventory System</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background-color: #f5f7fb;
            font-family: "Segoe UI", Roboto, sans-serif;
        }

        /* Page container */
        .page-container {
            padding: 25px;
            max-width: 1200px;
            margin: auto;
        }

        /* Header */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .page-title {
            font-size: 20px;
            font-weight: 700;
            color: #111827;
        }

        .page-subtitle {
            font-size: 13px;
            color: #6b7280;
        }

        /* ERP card */
        .erp-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 22px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.08);
        }

        /* Table */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 900px;
        }

        table th,
        table td {
            text-align: center;
            vertical-align: middle;
            font-size: 13px;
            white-space: nowrap;
        }

        table th {
            background-color: #f1f5f9;
            font-weight: 600;
        }

        /* Action button */
        .action-btn {
            padding: 4px 10px;
            font-size: 12px;
            white-space: nowrap;
        }
    </style>
</head>

<body>

<div class="page-container">

    <!-- HEADER -->
    <div class="page-header">
        <div>
            <div class="page-title">Billing History</div>
            <div class="page-subtitle">
                Sales Records → Bills generated by you
            </div>
        </div>

        <a th:href="@{/staff/dashboard}" class="btn btn-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>
    </div>

    <!-- TABLE CARD -->
    <div class="erp-card">

        <div class="table-responsive">
            <table class="table table-bordered table-hover table-sm">
                <thead>
                <tr>
                    <th>S.No</th>
                    <th>Date & Time</th>
                    <th>Customer Name</th>
                    <th>Grand Total</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="bill, stat : ${bills}">
                    <td th:text="${stat.index + 1}"></td>

                    <td th:text="${#temporals.format(bill.billDate,'dd-MM-yyyy hh:mm a')}"></td>

                    <td th:text="${bill.customer.name}"></td>

                    <td th:text="${bill.grandTotal}"></td>

                    <td>
                        <a th:href="@{/staff/billing/view/{id}(id=${bill.id})}"
                           class="btn btn-outline-primary btn-sm action-btn">
                            View
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>

</div>

</body>
</html>
