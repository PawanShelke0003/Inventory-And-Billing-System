<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Create Bill | Inventory System</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
        margin: 0;
        background-color: #f5f7fb;
        font-family: "Segoe UI", Roboto, sans-serif;
    }

    /* Page container */
    .page-container {
        padding: 25px;
        max-width: 1200px;
        margin: auto;
    }

    /* Header */
    .page-header {
        margin-bottom: 20px;
    }

    .page-title {
        font-size: 20px;
        font-weight: 700;
        color: #111827;
    }

    .page-subtitle {
        font-size: 13px;
        color: #6b7280;
    }

    /* ERP card */
    .erp-card {
        background: #ffffff;
        border-radius: 8px;
        padding: 22px;
        box-shadow: 0 1px 6px rgba(0,0,0,0.08);
    }

    /* Section title */
    .section-title {
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 10px;
        color: #111827;
    }

    /* Table */
    table th,
    table td {
        text-align: center;
        vertical-align: middle;
        font-size: 13px;
    }

    table th {
        background-color: #f1f5f9;
        font-weight: 600;
    }

    /* Quantity input */
    .qty-input {
        max-width: 90px;
        margin: auto;
    }

    /* Footer actions */
    .form-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="page-container">

  <!-- HEADER -->
  <div class="page-header">
    <div class="page-title">Create Bill</div>
    <div class="page-subtitle">
      Point of Sale → Generate customer invoice
    </div>
  </div>

  <form th:action="@{/staff/billing/save}" method="post">

    <!-- CUSTOMER DETAILS -->
    <div class="erp-card mb-4">
      <div class="section-title">Customer Details</div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Customer Name</label>
          <input type="text"
                 name="customerName"
                 class="form-control"
                 placeholder="Enter customer name"
                 required>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Phone Number</label>
          <input type="text"
                 name="phone"
                 class="form-control"
                 placeholder="Enter phone number"
                 required>
        </div>
      </div>
    </div>

    <!-- PRODUCT SELECTION -->
    <div class="erp-card">
      <div class="section-title">Add Products</div>

      <div class="table-responsive">
        <table class="table table-bordered table-hover table-sm">
          <thead>
          <tr>
            <th style="width: 60px">S.No</th>
            <th>Product Name</th>
            <th style="width: 140px">Quantity</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="p, stat : ${products}">
            <td th:text="${stat.index + 1}"></td>

            <td th:text="${p.name}"></td>

            <td>
              <input type="number"
                     min="0"
                     class="form-control form-control-sm qty-input"
                     th:name="|items[${stat.index}].quantity|">
            </td>

            <input type="hidden"
                   th:name="|items[${stat.index}].productId|"
                   th:value="${p.id}">
          </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ACTIONS -->
    <div class="form-actions" style="gap: 10px;">
      <a th:href="@{/staff/dashboard}" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Back
      </a>
      <button type="submit" class="btn btn-success">
        <i class="bi bi-receipt"></i> Generate Bill
      </button>
    </div>

  </form>

</div>

</body>
</html>
