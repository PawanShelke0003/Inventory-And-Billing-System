<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Staff Dashboard | Inventory System</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
        margin: 0;
        background-color: #f5f7fb;
        font-family: "Segoe UI", Roboto, sans-serif;
    }

    /* Top bar */
    .topbar {
        background-color: #1f2937;
        color: #ffffff;
        padding: 14px 22px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .topbar-title {
        font-size: 16px;
        font-weight: 600;
    }

    /* Page container */
    .page-container {
        padding: 25px;
        max-width: 1200px;
        margin: auto;
    }

    /* Section title */
    .section-title {
        font-size: 18px;
        font-weight: 700;
        color: #111827;
        margin-bottom: 15px;
    }

    /* Manager Dashboard Style Cards */
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
    }
    
    .stat-card {
        background: white;
        border-radius: 10px;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        transition: transform 0.2s;
        text-decoration: none;
        color: inherit;
        border: 1px solid #f1f5f9;
    }
    
    .stat-card:hover {
        transform: translateY(-5px);
        color: inherit;
    }
    
    .stat-info h2 {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        color: #111827;
        margin-top: 5px;
    }
    
    .stat-info small {
        color: #6b7280;
        font-size: 14px;
        font-weight: 500;
        text-transform: uppercase;
    }
    
    .stat-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
    }
    
    .icon-green { background: #d1fae5; color: #10b981; }
    .icon-blue { background: #dbeafe; color: #3b82f6; }
    .icon-orange { background: #ffedd5; color: #f97316; }
    .icon-purple { background: #ede9fe; color: #8b5cf6; }

    /* ERP card */
    .erp-card {
        background: #ffffff;
        border-radius: 12px;
        padding: 22px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.04);
        border: 1px solid #e5e7eb;
    }

    /* Low stock alert */
    .low-stock-box {
        background-color: #fff7ed;
        border: 1px solid #fed7aa;
        border-radius: 8px;
        padding: 18px;
        margin-bottom: 25px;
    }

    .low-stock-box h6 {
        font-weight: 700;
        color: #9a3412;
        margin-bottom: 10px;
    }

    .low-stock-box ul {
        padding-left: 18px;
        margin-bottom: 0;
    }

    /* Table */
    .table-responsive {
        overflow-x: auto;
    }

    table {
        width: 100%;
        min-width: 800px;
    }

    table th,
    table td {
        text-align: center;
        vertical-align: middle;
        font-size: 13px;
        white-space: nowrap;
    }

    table th {
        background-color: #f1f5f9;
        font-weight: 600;
    }

    .action-btn {
        padding: 4px 10px;
        font-size: 12px;
    }
  </style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-title" th:text="${globalSettings != null ? globalSettings.storeName : 'Inventory Billing System'}">Inventory Billing System</div>

  <form th:action="@{/logout}" method="post">
    <button class="btn btn-outline-light btn-sm">
      <i class="bi bi-box-arrow-right"></i> Logout
    </button>
  </form>
</div>

<div class="page-container">

  <!-- DASHBOARD TITLE -->
  <div class="section-title">Staff Dashboard</div>

  <!-- DATA CARDS (ROW 1) -->
  <div class="stats-grid">
    <!-- Today's Bills -->
    <div class="stat-card">
      <div class="stat-info">
        <small>Today's Bills</small>
        <h2 th:text="${todaysBillCount}">0</h2>
      </div>
      <div class="stat-icon icon-blue"><i class="bi bi-receipt-cutoff"></i></div>
    </div>

    <!-- Today's Sales -->
    <div class="stat-card">
      <div class="stat-info">
        <small>Today's Sales</small>
        <h2>₹ <span th:text="${todaysSales}">0.00</span></h2>
      </div>
      <div class="stat-icon icon-green"><i class="bi bi-currency-rupee"></i></div>
    </div>
    
    <!-- Total Bills -->
    <div class="stat-card">
      <div class="stat-info">
        <small>Total Bills</small>
        <h2 th:text="${#lists.size(recentBills)}">0</h2>
      </div>
      <div class="stat-icon icon-purple"><i class="bi bi-files"></i></div>
    </div>

    <!-- Low Stock Items -->
    <div class="stat-card">
      <div class="stat-info">
        <small>Low Stock Items</small>
        <h2 th:text="${#lists.size(lowStockProducts)}">0</h2>
      </div>
      <div class="stat-icon icon-orange"><i class="bi bi-exclamation-triangle"></i></div>
    </div>
  </div>

  <!-- ACTION CARDS (ROW 2) -->
  <div class="stats-grid">
    <!-- Create Bill -->
    <a th:href="@{/staff/billing}" class="stat-card">
      <div class="stat-info">
        <small>Action</small>
        <h2>Create New Bill</h2>
      </div>
      <div class="stat-icon icon-blue"><i class="bi bi-plus-circle"></i></div>
    </a>

    <!-- History -->
    <a th:href="@{/staff/billing/history}" class="stat-card">
      <div class="stat-info">
        <small>Action</small>
        <h2>View Bill History</h2>
      </div>
      <div class="stat-icon icon-orange"><i class="bi bi-clock-history"></i></div>
    </a>
  </div>

  <!-- LOW STOCK ALERT -->
  <div th:if="${lowStockProducts.size() > 0}" class="low-stock-box">
    <h6><i class="bi bi-exclamation-triangle"></i> Low Stock Warning</h6>
    <ul>
      <li th:each="p : ${lowStockProducts}">
        <span th:text="${p.name}"></span> —
        Remaining:
        <strong th:text="${p.quantity}"></strong>
      </li>
    </ul>
  </div>

  <!-- RECENT BILLS -->
  <div class="erp-card">
    <h6 class="mb-3 fw-semibold">Recent Bills</h6>

    <div class="table-responsive">
      <table class="table table-bordered table-hover table-sm">
        <thead>
        <tr>
          <th>S.No</th>
          <th>Date & Time</th>
          <th>Total Amount</th>
          <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="b, stat : ${recentBills}" th:if="${stat.index < 10}">
          <td th:text="${stat.index + 1}"></td>
          <td th:text="${#temporals.format(b.billDate,'dd-MM-yyyy hh:mm a')}"></td>
          <td th:text="${b.grandTotal}"></td>
          <td>
            <a th:href="@{/staff/billing/view/{id}(id=${b.id})}"
               class="btn btn-outline-primary btn-sm action-btn">
              View
            </a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

</body>
</html>
