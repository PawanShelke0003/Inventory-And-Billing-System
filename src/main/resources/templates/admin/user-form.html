<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add User | Inventory System</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background-color: #f5f7fb;
            font-family: "Segoe UI", Roboto, sans-serif;
        }

        /* Page container */
        .page-container {
            padding: 25px;
            max-width: 900px;
            margin: auto;
        }

        /* Header */
        .page-header {
            margin-bottom: 20px;
        }

        .page-title {
            font-size: 20px;
            font-weight: 700;
            color: #111827;
        }

        .page-subtitle {
            font-size: 13px;
            color: #6b7280;
        }

        /* ERP card */
        .erp-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.08);
        }

        /* Labels */
        .form-label {
            font-weight: 600;
            font-size: 13px;
            color: #111827;
        }

        .form-text {
            font-size: 12px;
            color: #6b7280;
        }

        /* Footer actions */
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<div class="page-container">

    <!-- HEADER -->
    <div class="page-header">
        <div class="page-title">Create User</div>
        <div class="page-subtitle">
            User Management → Assign system access and role
        </div>
    </div>

    <!-- FORM CARD -->
    <div class="erp-card">

        <form th:action="@{/admin/users/save}"
              method="post">

            <!-- ROW 1 -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Username</label>
                    <input type="text"
                           name="username"
                           class="form-control"
                           placeholder="e.g. staff01"
                           required>
                    <div class="form-text">
                        Unique login ID for the user
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Password</label>
                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Enter secure password"
                           required>
                    <div class="form-text">
                        Minimum 8 characters recommended
                    </div>
                </div>
            </div>

            <!-- ROW 2 -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Role</label>
                    <select name="role"
                            class="form-select"
                            required>
                        <option value="">Select role</option>
                        <option th:each="r : ${roles}"
                                th:value="${r}"
                                th:text="${r}">
                        </option>
                    </select>
                    <div class="form-text">
                        Determines user permissions in the system
                    </div>
                </div>
            </div>

            <!-- ACTIONS -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-sm">
                    <i class="bi bi-check-lg"></i> Save User
                </button>

                <a th:href="@{/admin/users}"
                   class="btn btn-secondary btn-sm">
                    Cancel
                </a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
