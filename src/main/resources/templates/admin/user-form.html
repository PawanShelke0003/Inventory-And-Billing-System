<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: admin_layout(${user.id == null ? 'Add User' : 'Edit User'}, ~{::content})}" th:with="activeMenu='users'">
<body>
<div th:fragment="content">
    <!-- HEADER -->
    <div class="page-header">
        <div class="page-title" th:text="${user.id == null ? 'Create User' : 'Edit User'}">Create User</div>
        <div class="page-subtitle">
            User Management → Assign system access and role
        </div>
    </div>

    <!-- FORM CARD -->
    <div class="form-container">

        <form th:action="@{/admin/users/save}"
              method="post"
              th:object="${user}">
              
            <input type="hidden" th:field="*{id}" />

            <!-- ROW 1 -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Username</label>
                    <input type="text"
                           th:field="*{username}"
                           class="form-control"
                           placeholder="e.g. staff01"
                           required>
                    <div class="form-text">
                        Unique login ID for the user
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Password</label>
                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Enter secure password"
                           th:required="${user.id == null}">
                    <div class="form-text">
                        <span th:if="${user.id == null}">Minimum 8 characters recommended</span>
                        <span th:unless="${user.id == null}">Leave blank to keep existing password</span>
                    </div>
                </div>
            </div>

            <!-- ROW 2 -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Role</label>
                    <select th:field="*{role}"
                            class="form-select"
                            required>
                        <option value="">Select role</option>
                        <option th:each="r : ${roles}"
                                th:value="${r}"
                                th:text="${r.name() == 'ROLE_OWNER' ? 'Owner' : (r.name() == 'ROLE_MANAGER' ? 'Manager' : (r.name() == 'ROLE_STAFF' ? 'Staff' : r.name()))}"
                                th:if="${isOwner or r.name() == 'ROLE_STAFF'}">
                        </option>
                    </select>
                    <div class="form-text">
                        Determines user permissions in the system
                    </div>
                </div>
            </div>

            <!-- ACTIONS -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-sm">
                    <i class="bi bi-check-lg"></i> Save User
                </button>

                <a th:href="@{/admin/users}"
                   class="btn btn-secondary btn-sm">
                    Cancel
                </a>
            </div>

        </form>

    </div>
</div>
</body>
</html>
