<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: admin_layout('Add User', ~{::content})}" th:with="activeMenu='users'">
<body>
<div th:fragment="content">
    <!-- HEADER -->
    <div class="page-header">
        <div class="page-title">Create User</div>
        <div class="page-subtitle">
            User Management → Assign system access and role
        </div>
    </div>

    <!-- FORM CARD -->
    <div class="form-container">

        <form th:action="@{/admin/users/save}"
              method="post">

            <!-- ROW 1 -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Username</label>
                    <input type="text"
                           name="username"
                           class="form-control"
                           placeholder="e.g. staff01"
                           required>
                    <div class="form-text">
                        Unique login ID for the user
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Password</label>
                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Enter secure password"
                           required>
                    <div class="form-text">
                        Minimum 8 characters recommended
                    </div>
                </div>
            </div>

            <!-- ROW 2 -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Role</label>
                    <select name="role"
                            class="form-select"
                            required>
                        <option value="">Select role</option>
                        <option th:each="r : ${roles}"
                                th:value="${r}"
                                th:text="${r}">
                        </option>
                    </select>
                    <div class="form-text">
                        Determines user permissions in the system
                    </div>
                </div>
            </div>

            <!-- ACTIONS -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-sm">
                    <i class="bi bi-check-lg"></i> Save User
                </button>

                <a th:href="@{/admin/users}"
                   class="btn btn-secondary btn-sm">
                    Cancel
                </a>
            </div>

        </form>

    </div>
</div>
</body>
</html>
