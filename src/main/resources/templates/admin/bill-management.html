<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: admin_layout('Staff Directory', ~{::content})}" th:with="activeMenu='bills'">
<body>
<div th:fragment="content">
    
    <div class="page-header" style="margin-bottom: 24px;">
        <div>
            <div class="page-title">Staff Billing Profiles</div>
            <div class="page-subtitle">Select a staff member to view their billing history and daily reconciliation.</div>
        </div>
    </div>

    <!-- STAFF TABLE -->
    <div class="table-container">
        <div class="table-responsive">
            <table class="table">
                <thead>
                <tr>
                    <th style="width:60px;">#</th>
                    <th>Staff Name</th>
                    <th>Role</th>
                    <th style="width:180px;">Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user, stat : ${users}">
                    <td style="color:#94a3b8; font-weight:600;" th:text="${stat.count}">1</td>
                    <td>
                        <div style="display:flex; align-items:center; gap:12px;">
                            <div style="width:38px; height:38px; background:#eff6ff; color:#3b82f6; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;">
                                <i class="bi bi-person-badge"></i>
                            </div>
                            <span style="font-weight:600; color:#1e293b;" th:text="${user.username}">Staff Name</span>
                        </div>
                    </td>
                    <td>
                        <span style="background:#dcfce7; color:#166534; padding:4px 10px; border-radius:12px; font-size:12px; font-weight:700;"
                              th:text="${user.role.name() == 'ROLE_STAFF' ? 'Staff' : (user.role.name() == 'ROLE_MANAGER' ? 'Manager' : 'Owner')}">Staff</span>
                    </td>
                    <td>
                        <a th:href="@{/admin/bills/staff/{id}(id=${user.id})}" class="action-btn">
                            <i class="bi bi-bar-chart-line"></i> View Billing Profile
                        </a>
                    </td>
                </tr>

                <tr th:if="${users == null or users.isEmpty()}">
                    <td colspan="4">
                        <div style="text-align:center; padding:60px 20px; color:#94a3b8;">
                            <i class="bi bi-people" style="font-size:3rem; display:block; margin-bottom:12px;"></i>
                            <div style="font-size:16px; font-weight:600; color:#64748b;">No staff members found</div>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
