<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: admin_layout('Overview', ~{::content})}" th:with="activeMenu='dashboard'">
<body>
<div th:fragment="content">
    <!-- STATS CARDS -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-info">
                <small>Total Revenue</small>
                <h2 th:text="${totalRevenue != null ? totalRevenue : '0.00'}">0.00</h2>
            </div>
            <div class="stat-icon icon-green"><i class="bi bi-currency-dollar"></i></div>
        </div>
        
        <div class="stat-card">
            <div class="stat-info">
                <small>Total Bills</small>
                <h2 th:text="${billCount}">0</h2>
            </div>
            <div class="stat-icon icon-blue"><i class="bi bi-receipt"></i></div>
        </div>
        
        <div class="stat-card">
            <div class="stat-info">
                <small>Products</small>
                <h2 th:text="${productCount}">0</h2>
            </div>
            <div class="stat-icon icon-orange"><i class="bi bi-box-seam"></i></div>
        </div>
        
        <div class="stat-card">
            <div class="stat-info">
                <small>Active Users</small>
                <h2 th:text="${userCount}">0</h2>
            </div>
            <div class="stat-icon icon-purple"><i class="bi bi-people"></i></div>
        </div>
    </div>

    <!-- TABLE SECTION -->
    <div class="table-container">
        <h4 class="table-title">Recent Bill History</h4>
        
        <div class="table-responsive">
            <table class="table">
                <thead>
                <tr>
                    <th>S.No</th>
                    <th>Date & Time</th>
                    <th>Customer Name</th>
                    <th>Staff</th>
                    <th>Total Amount</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="b, stat : ${bills}">
                    <td th:text="${stat.index + 1}">1</td>
                    <td th:text="${#temporals.format(b.billDate,'dd-MM-yyyy hh:mm a')}">Date</td>
                    <td th:text="${b.customer.name}" style="font-weight: 600;">Customer</td>
                    <td th:text="${b.createdBy.username}">Staff</td>
                    <td th:text="${b.grandTotal}" class="amt-text">0.00</td>
                    <td>
                        <a th:href="@{/admin/billing/view/{id}(id=${b.id})}" class="action-btn">View</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
