<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: admin_layout('Overview', ~{::content})}" th:with="activeMenu='dashboard'">
<body>
<div th:fragment="content">
    <!-- STATS CARDS -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-info">
                <small>Total Revenue</small>
                <h2>₹ <span th:text="${totalRevenue != null ? totalRevenue : '0.00'}">0.00</span></h2>
            </div>
            <div class="stat-icon icon-green"><i class="bi bi-currency-rupee"></i></div>
        </div>
        
        <div class="stat-card">
            <div class="stat-info">
                <small>Total Bills</small>
                <h2 th:text="${billCount}">0</h2>
            </div>
            <div class="stat-icon icon-blue"><i class="bi bi-receipt"></i></div>
        </div>
        
        <div class="stat-card">
            <div class="stat-info">
                <small>Products</small>
                <h2 th:text="${productCount}">0</h2>
            </div>
            <div class="stat-icon icon-orange"><i class="bi bi-box-seam"></i></div>
        </div>
        
        <div class="stat-card">
            <div class="stat-info">
                <small>Active Users</small>
                <h2 th:text="${userCount}">0</h2>
            </div>
            <div class="stat-icon icon-purple"><i class="bi bi-people"></i></div>
        </div>
    </div>

</div>
</body>
</html>
