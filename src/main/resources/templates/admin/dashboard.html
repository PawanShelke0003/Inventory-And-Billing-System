<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard | Inventory System</title>

  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
        margin: 0;
        background-color: #f5f7fb;
        font-family: "Segoe UI", Roboto, sans-serif;
    }

    /* Sidebar */
    .sidebar {
        width: 240px;
        height: 100vh;
        position: fixed;
        background-color: #1f2937;
        color: #fff;
        padding: 20px 15px;
    }

    .sidebar h5 {
        font-weight: 600;
        margin-bottom: 30px;
        text-align: center;
    }

    .sidebar a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        margin-bottom: 8px;
        color: #cbd5e1;
        text-decoration: none;
        border-radius: 6px;
        font-size: 14px;
    }

    .sidebar a:hover,
    .sidebar a.active {
        background-color: #374151;
        color: #ffffff;
    }

    /* Main */
    .main {
        margin-left: 240px;
        padding: 25px;
    }

    /* Top bar */
    .topbar {
        background: #ffffff;
        padding: 15px 20px;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        margin-bottom: 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    /* Stats */
    .stats-bar {
        display: flex;
        gap: 15px;
        margin-bottom: 40px;
    }

    .stat-box {
        flex: 1;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 18px;
        text-align: center;
    }

    .stat-box small {
        color: #6b7280;
        font-weight: 600;
        font-size: 13px;
    }

    .stat-box h4 {
        margin-top: 8px;
        font-weight: 700;
        color: #111827;
    }

    /* Bill History */
    .bill-section {
        background: #ffffff;
        border-radius: 8px;
        padding: 24px;
        box-shadow: 0 1px 6px rgba(0,0,0,0.08);
    }

    .bill-title {
        font-size: 18px;
        font-weight: 700;
        color: #111827;
        margin-bottom: 6px;
    }

    .bill-divider {
        height: 2px;
        width: 60px;
        background-color: #2563eb;
        margin-bottom: 18px;
    }

    /* TABLE FIX */
    .table-responsive {
        overflow-x: auto; /* 🔥 KEY FIX */
    }

    table {
        min-width: 980px; /* ensures Action column stays visible */
        width: 100%;
    }

    table th,
    table td {
        text-align: center;
        vertical-align: middle;
        font-size: 13px;
        white-space: nowrap;
    }

    table th {
        background-color: #f1f5f9;
        font-weight: 600;
    }

    /* Action button */
    .action-btn {
        padding: 4px 12px;
        white-space: nowrap;
    }
  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h5>Inventory System</h5>

  <a href="#" class="active"><i class="bi bi-speedometer2"></i> Dashboard</a>
  <a href="/admin/products"><i class="bi bi-box"></i> Products</a>
  <a href="/admin/categories"><i class="bi bi-tags"></i> Categories</a>
  <a href="/admin/users"><i class="bi bi-people"></i> Users</a>
  <a href="/admin/products/stock"><i class="bi bi-exclamation-circle"></i> Stock Alerts</a>

  <hr class="text-secondary">

  <form th:action="@{/logout}" method="post">
    <button class="btn btn-outline-light btn-sm w-100">
      <i class="bi bi-box-arrow-right"></i> Logout
    </button>
  </form>
</div>

<!-- MAIN -->
<div class="main">

  <div class="topbar">
    <h5 class="mb-0">Admin Dashboard</h5>
    <span class="text-muted">Welcome, Admin</span>
  </div>

  <!-- STATS -->
  <div class="stats-bar">
    <div class="stat-box">
      <small>Total Revenue</small>
      <h4 th:text="${totalRevenue}">0</h4>
    </div>
    <div class="stat-box">
      <small>Total Bills</small>
      <h4 th:text="${billCount}">0</h4>
    </div>
    <div class="stat-box">
      <small>Products</small>
      <h4 th:text="${productCount}">0</h4>
    </div>
    <div class="stat-box">
      <small>Users</small>
      <h4 th:text="${userCount}">0</h4>
    </div>
  </div>

  <!-- BILL HISTORY -->
  <div class="bill-section">
    <div class="bill-title">Bill History</div>
    <div class="bill-divider"></div>

    <div class="table-responsive">
      <table class="table table-sm table-bordered table-hover">
        <thead>
        <tr>
          <th>S.No</th>
          <th>Date & Time</th>
          <th>Customer Name</th>
          <th>Staff</th>
          <th>Total Amount</th>
          <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="b, stat : ${bills}">
          <td th:text="${stat.index + 1}"></td>
          <td th:text="${#temporals.format(b.billDate,'dd-MM-yyyy hh:mm a')}"></td>
          <td th:text="${b.customer.name}"></td>
          <td th:text="${b.createdBy.username}"></td>
          <td th:text="${b.grandTotal}"></td>
          <td>
            <a th:href="@{/staff/billing/view/{id}(id=${b.id})}"
               class="btn btn-sm btn-outline-primary action-btn">
              View
            </a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

  </div>

</div>

</body>
</html>
