<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: admin_layout(${category.id == null ? 'Add Category' : 'Edit Category'}, ~{::content})}" th:with="activeMenu='categories'">
<body>
<div th:fragment="content">
    <!-- HEADER -->
    <div class="page-header">
        <div class="page-title" th:text="${category.id == null ? 'Create Category' : 'Edit Category'}">Create Category</div>
        <div class="page-subtitle">
            Category Master → Define product classification
        </div>
    </div>

    <!-- FORM CARD -->
    <div class="form-container">

        <form th:action="@{/admin/categories/save}"
              method="post"
              th:object="${category}">
            
            <input type="hidden" th:field="*{id}" />

            <!-- ROW 1 -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Category Name</label>
                    <input type="text"
                           th:field="*{name}"
                           class="form-control"
                           placeholder="e.g. Electronics"
                           required>
                    <div class="form-text">
                        Enter a unique category name
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Description</label>
                    <textarea th:field="*{description}"
                              class="form-control"
                              rows="3"
                              placeholder="Brief description of the category">
                    </textarea>
                    <div class="form-text">
                        Optional details for internal reference
                    </div>
                </div>
            </div>

            <!-- ACTIONS -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-sm">
                    <i class="bi bi-check-lg"></i> Save Category
                </button>

                <a th:href="@{/admin/categories}"
                   class="btn btn-secondary btn-sm">
                    Cancel
                </a>
            </div>

        </form>

    </div>
</div>
</body>
</html>
