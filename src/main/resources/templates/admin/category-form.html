<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Category | Inventory System</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background-color: #f5f7fb;
            font-family: "Segoe UI", Roboto, sans-serif;
        }

        /* Page container */
        .page-container {
            padding: 25px;
            max-width: 900px;
            margin: auto;
        }

        /* Header */
        .page-header {
            margin-bottom: 20px;
        }

        .page-title {
            font-size: 20px;
            font-weight: 700;
            color: #111827;
        }

        .page-subtitle {
            font-size: 13px;
            color: #6b7280;
        }

        /* ERP card */
        .erp-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.08);
        }

        /* Labels */
        .form-label {
            font-weight: 600;
            font-size: 13px;
            color: #111827;
        }

        .form-text {
            font-size: 12px;
            color: #6b7280;
        }

        /* Footer actions */
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<div class="page-container">

    <!-- HEADER -->
    <div class="page-header">
        <div class="page-title">Create Category</div>
        <div class="page-subtitle">
            Category Master → Define product classification
        </div>
    </div>

    <!-- FORM CARD -->
    <div class="erp-card">

        <form th:action="@{/admin/categories/save}"
              method="post"
              th:object="${category}">

            <!-- ROW 1 -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Category Name</label>
                    <input type="text"
                           th:field="*{name}"
                           class="form-control"
                           placeholder="e.g. Electronics"
                           required>
                    <div class="form-text">
                        Enter a unique category name
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Description</label>
                    <textarea th:field="*{description}"
                              class="form-control"
                              rows="3"
                              placeholder="Brief description of the category">
                    </textarea>
                    <div class="form-text">
                        Optional details for internal reference
                    </div>
                </div>
            </div>

            <!-- ACTIONS -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-sm">
                    <i class="bi bi-check-lg"></i> Save Category
                </button>

                <a th:href="@{/admin/categories}"
                   class="btn btn-secondary btn-sm">
                    Cancel
                </a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
