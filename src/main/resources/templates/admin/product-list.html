<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: admin_layout('Products', ~{::content})}" th:with="activeMenu='products'">
<body>
<div th:fragment="content">
    <!-- HEADER -->
  <div class="page-header">
    <div class="page-title">Product Master</div>

    <a th:href="@{/admin/products/add}" class="btn btn-success btn-sm">
      <i class="bi bi-plus-lg"></i> Add Product
    </a>
  </div>

  <!-- TABLE CARD -->
  <div class="table-container">

    <div class="table-responsive">
      <table class="table">
        <thead>
        <tr>
          <th>ID</th>
          <th>Product Name</th>
          <th>Category</th>
          <th>Price</th>
          <th>Stock</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${products}">
          <td th:text="${p.id}"></td>
          <td th:text="${p.name}"></td>
          <td th:text="${p.category.name}"></td>
          <td th:text="${p.price}"></td>
          <td th:text="${p.quantity}"></td>

          <!-- STATUS -->
          <td>
            <span th:if="${p.active}" class="badge-active">Active</span>
            <span th:unless="${p.active}" class="badge-inactive">Inactive</span>
          </td>

          <!-- ACTIONS -->
          <td>
            <a th:href="@{/admin/products/edit/{id}(id=${p.id})}"
               class="action-btn">
              <i class="bi bi-pencil"></i> Edit
            </a>
            <a th:if="${p.active}" th:href="@{/admin/products/toggle/{id}(id=${p.id})}"
               class="action-btn btn-danger-light">
              Deactivate
            </a>
            <a th:unless="${p.active}" th:href="@{/admin/products/toggle/{id}(id=${p.id})}"
               class="action-btn" style="background-color: #dcfce7; color: #166534;">
              Activate
            </a>

            <a th:href="@{/admin/products/stock/{id}(id=${p.id})}"
               class="btn btn-info btn-sm action-btn">
              Stock
            </a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

  </div>

  
</div>
</body>
</html>
