<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: admin_layout(${product.id == null ? 'Add Product' : 'Edit Product'}, ~{::content})}" th:with="activeMenu='products'">
<body>
<div th:fragment="content">
    <!-- HEADER -->
  <div class="page-header">
    <div class="page-title" th:text="${product.id == null ? 'Create Product' : 'Edit Product'}">Create Product</div>
    <div class="page-subtitle">
      Product Master → Define basic product details
    </div>
  </div>

  <!-- FORM CARD -->
  <div class="form-container">

    <form th:action="@{/admin/products/save}"
          method="post"
          th:object="${product}">
          
      <input type="hidden" th:field="*{id}" />

      <!-- ROW 1 -->
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Product Name</label>
          <input type="text"
                 th:field="*{name}"
                 class="form-control"
                 placeholder="e.g. Wireless Mouse"
                 required>
          <div class="form-text">
            Enter the official product name
          </div>
        </div>

        <div class="col-md-6">
          <label class="form-label">Category</label>
          <select name="categoryId"
                  class="form-select"
                  required>
            <option value="">Select category</option>
            <option th:each="c : ${categories}"
                    th:value="${c.id}"
                    th:text="${c.name}"
                    th:selected="${product.category != null and product.category.id.toString() == c.id.toString()}">
            </option>
          </select>
          <div class="form-text">
            Choose the product classification
          </div>
        </div>
      </div>

      <!-- ROW 2 -->
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Unit Price</label>
          <input type="number"
                 step="0.01"
                 th:field="*{price}"
                 class="form-control"
                 placeholder="0.00"
                 required>
          <div class="form-text">
            Selling price per unit
          </div>
        </div>

        <div class="col-md-6">
          <label class="form-label">Opening Stock Quantity</label>
          <input type="number"
                 th:field="*{quantity}"
                 class="form-control"
                 placeholder="0"
                 required>
          <div class="form-text">
            Initial stock available at creation
          </div>
        </div>
      </div>

      <!-- ACTIONS -->
      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-sm">
          <i class="bi bi-check-lg"></i> Save Product
        </button>

        <a th:href="@{/admin/products}"
           class="btn btn-secondary btn-sm">
          Cancel
        </a>
      </div>

    </form>

  </div>
</div>
</body>
</html>
