<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: admin_layout('Update Stock', ~{::content})}" th:with="activeMenu='stock'">
<body>
<div th:fragment="content">
    <!-- HEADER -->
  <div class="page-header">
    <div class="page-title">Stock Adjustment</div>
    <div class="page-subtitle">
      Inventory Management → Update Available Quantity
    </div>
  </div>

  <!-- FORM CARD -->
  <div class="form-container">

    <form th:action="@{/admin/products/stock/update}"
          method="post">

      <!-- Hidden Product ID -->
      <input type="hidden" name="productId"
             th:value="${product.id}"/>

      <!-- ROW 1 -->
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Product Name</label>
          <input type="text"
                 class="form-control"
                 th:value="${product.name}"
                 readonly>
          <div class="form-text">
            Selected product for stock adjustment
          </div>
        </div>

        <div class="col-md-6">
          <label class="form-label">Current Stock</label>
          <input type="number"
                 class="form-control"
                 th:value="${product.quantity}"
                 readonly>
          <div class="form-text">
            Quantity currently available in inventory
          </div>
        </div>
      </div>

      <!-- ROW 2 -->
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Updated Stock Quantity</label>
          <input type="number"
                 name="quantity"
                 min="0"
                 step="1"
                 class="form-control"
                 placeholder="Enter new total quantity"
                 required>
          <div class="form-text">
            This will replace the existing stock quantity
          </div>
        </div>
      </div>

      <!-- ACTIONS -->
      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-sm">
          <i class="bi bi-arrow-repeat"></i> Update Stock
        </button>

        <a th:href="@{/admin/products}"
           class="btn btn-secondary btn-sm">
          Cancel
        </a>
      </div>

    </form>

  </div>
</div>
</body>
</html>
