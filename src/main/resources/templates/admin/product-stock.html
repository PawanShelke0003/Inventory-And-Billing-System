<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Update Stock | Inventory System</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
        margin: 0;
        background-color: #f5f7fb;
        font-family: "Segoe UI", Roboto, sans-serif;
    }

    /* Page container */
    .page-container {
        padding: 25px;
        max-width: 1000px;
        margin: auto;
    }

    /* Header */
    .page-header {
        margin-bottom: 20px;
    }

    .page-title {
        font-size: 20px;
        font-weight: 700;
        color: #111827;
    }

    .page-subtitle {
        font-size: 13px;
        color: #6b7280;
    }

    /* ERP card */
    .erp-card {
        background: #ffffff;
        border-radius: 8px;
        padding: 24px;
        box-shadow: 0 1px 6px rgba(0,0,0,0.08);
    }

    /* Labels */
    .form-label {
        font-weight: 600;
        font-size: 13px;
        color: #111827;
    }

    .form-text {
        font-size: 12px;
        color: #6b7280;
    }

    /* Readonly fields */
    .form-control[readonly] {
        background-color: #f9fafb;
        cursor: not-allowed;
    }

    /* Footer actions */
    .form-actions {
        display: flex;
        gap: 10px;
        margin-top: 25px;
    }
  </style>
</head>

<body>

<div class="page-container">

  <!-- HEADER -->
  <div class="page-header">
    <div class="page-title">Stock Adjustment</div>
    <div class="page-subtitle">
      Inventory Management → Update Available Quantity
    </div>
  </div>

  <!-- FORM CARD -->
  <div class="erp-card">

    <form th:action="@{/admin/products/stock/update}"
          method="post">

      <!-- Hidden Product ID -->
      <input type="hidden" name="productId"
             th:value="${product.id}"/>

      <!-- ROW 1 -->
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Product Name</label>
          <input type="text"
                 class="form-control"
                 th:value="${product.name}"
                 readonly>
          <div class="form-text">
            Selected product for stock adjustment
          </div>
        </div>

        <div class="col-md-6">
          <label class="form-label">Current Stock</label>
          <input type="number"
                 class="form-control"
                 th:value="${product.quantity}"
                 readonly>
          <div class="form-text">
            Quantity currently available in inventory
          </div>
        </div>
      </div>

      <!-- ROW 2 -->
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Updated Stock Quantity</label>
          <input type="number"
                 name="quantity"
                 class="form-control"
                 placeholder="Enter new total quantity"
                 required>
          <div class="form-text">
            This will replace the existing stock quantity
          </div>
        </div>
      </div>

      <!-- ACTIONS -->
      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-sm">
          <i class="bi bi-arrow-repeat"></i> Update Stock
        </button>

        <a th:href="@{/admin/products}"
           class="btn btn-secondary btn-sm">
          Cancel
        </a>
      </div>

    </form>

  </div>

</div>

</body>
</html>
