<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: admin_layout('User Management', ~{::content})}" th:with="activeMenu='users'">
<body>
<div th:fragment="content">
    <!-- HEADER -->
    <div class="page-header">
        <div>
            <div class="page-title">User Management</div>
            <div class="page-subtitle">
                System Access Control & Role Assignment
            </div>
        </div>

        <!-- HEADER ACTIONS -->
        <div class="header-actions">
            <a th:href="@{/admin/dashboard}"
               class="btn btn-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Back
            </a>

            <a class="btn btn-success btn-sm"
               th:href="@{/admin/users/add}">
                <i class="bi bi-plus-lg"></i> Add User
            </a>
        </div>
    </div>

    <!-- TABLE CARD -->
    <div class="table-container">

        <div class="table-responsive">
            <table class="table">
                <thead>
                <tr>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="u : ${users}">
                    <td th:text="${u.username}"></td>
                    <td th:text="${u.role.name() == 'ROLE_ADMIN' ? 'Manager' : (u.role.name() == 'ROLE_STAFF' ? 'Staff' : u.role.name())}"></td>

                    <!-- STATUS -->
                    <td>
                        <span th:if="${u.active}" class="badge-active">
                            Active
                        </span>
                        <span th:unless="${u.active}" class="badge-inactive">
                            Inactive
                        </span>
                    </td>

                    <!-- ACTION -->
                    <td>
                        <a th:if="${u.active}" th:href="@{/admin/users/toggle/{id}(id=${u.id})}"
                           class="action-btn btn-danger-light">
                            Deactivate
                        </a>
                        <a th:unless="${u.active}" th:href="@{/admin/users/toggle/{id}(id=${u.id})}"
                           class="action-btn" style="background-color: #dcfce7; color: #166534;">
                            Activate
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>
</body>
</html>
