<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Stock Management | Inventory System</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
        margin: 0;
        background-color: #f5f7fb;
        font-family: "Segoe UI", Roboto, sans-serif;
    }

    /* Page container */
    .page-container {
        padding: 25px;
        max-width: 1100px;
        margin: auto;
    }

    /* Header */
    .page-header {
        margin-bottom: 20px;
    }

    .page-title {
        font-size: 20px;
        font-weight: 700;
        color: #111827;
    }

    .page-subtitle {
        font-size: 13px;
        color: #6b7280;
    }

    /* ERP card */
    .erp-card {
        background: #ffffff;
        border-radius: 8px;
        padding: 22px;
        box-shadow: 0 1px 6px rgba(0,0,0,0.08);
    }

    /* Table */
    .table-responsive {
        overflow-x: auto;
    }

    table {
        width: 100%;
        min-width: 900px;
    }

    table th,
    table td {
        text-align: center;
        vertical-align: middle;
        font-size: 13px;
        white-space: nowrap;
    }

    table th {
        background-color: #f1f5f9;
        font-weight: 600;
    }

    /* Stock highlighting */
    .low-stock {
        color: #b91c1c;
        font-weight: 700;
    }

    .badge-low {
        background-color: #fee2e2;
        color: #991b1b;
        font-weight: 600;
        padding: 4px 8px;
        border-radius: 12px;
    }

    /* Status badges */
    .badge-active {
        background-color: #dcfce7;
        color: #166534;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 12px;
    }

    .badge-inactive {
        background-color: #e5e7eb;
        color: #374151;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 12px;
    }

    /* Footer action */
    .footer-action {
        margin-bottom: 15px;
    }
  </style>
</head>

<body>

<div class="page-container">

  <!-- HEADER -->
  <div class="page-header">
    <div class="page-title">Stock Management</div>
    <div class="page-subtitle">
      Inventory Control → Monitor available stock levels
    </div>
  </div>

  <!-- BACK -->
  <div class="footer-action">
    <a th:href="@{/admin/dashboard}" class="btn btn-secondary btn-sm">
      <i class="bi bi-arrow-left"></i> Back to Dashboard
    </a>
  </div>

  <!-- TABLE CARD -->
  <div class="erp-card">

    <div class="table-responsive">
      <table class="table table-bordered table-hover table-sm">
        <thead>
        <tr>
          <th>Product Name</th>
          <th>Unit Price</th>
          <th>Available Quantity</th>
          <th>Status</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="p : ${products}">
          <td th:text="${p.name}"></td>
          <td th:text="${p.price}"></td>

          <!-- STOCK -->
          <td>
                        <span th:text="${p.quantity}"
                              th:classappend="${p.quantity <= 5} ? 'low-stock' : ''">
                        </span>

            <span th:if="${p.quantity <= 5}" class="badge-low ms-2">
                            Low Stock
                        </span>
          </td>

          <!-- STATUS -->
          <td>
                        <span th:if="${p.active}" class="badge-active">
                            Active
                        </span>
            <span th:unless="${p.active}" class="badge-inactive">
                            Inactive
                        </span>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

  </div>

</div>

</body>
</html>
