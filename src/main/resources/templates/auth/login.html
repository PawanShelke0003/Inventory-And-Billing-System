<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Sign In | Inventory System</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    html, body {
        height: 100%;
        margin: 0;
    }

    body {
        background: linear-gradient(135deg, #667eea, #764ba2);
        font-family: "Segoe UI", sans-serif;
    }

    .page-center {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .login-card {
        width: 100%;
        max-width: 420px;
        border-radius: 16px;
        box-shadow: 0 18px 40px rgba(0,0,0,0.25);
        animation: fadeIn 0.5s ease-in-out;
        background: rgba(255, 255, 255, 0.92);
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(15px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .form-control:focus {
        box-shadow: none;
        border-color: #667eea;
    }

    .btn-primary {
        background-color: #667eea;
        border: none;
    }

    .btn-primary:hover {
        background-color: #5a67d8;
    }
  </style>
</head>

<body>

<div class="page-center">

  <div class="card login-card p-4">

    <!-- Header -->
    <div class="text-center mb-4">
      <i class="bi bi-box-seam fs-1 text-primary"></i>
      <h3 class="mt-2 fw-semibold">Welcome</h3>
      <p class="text-muted mb-0"><b>Please sign in to your account</b></p>
    </div>

    <!-- Login Error -->
    <div th:if="${param.error}" class="alert alert-danger py-2 text-center">
      Incorrect username or password. Please try again.
    </div>

    <!-- Logout Message -->
    <div th:if="${param.logout}" class="alert alert-success py-2 text-center">
      You’re logged out. Please sign in again.
    </div>

    <form th:action="@{/login}" method="post">

      <!-- Username -->
      <div class="mb-3">
        <label class="form-label fw-medium">Username</label>
        <div class="input-group">
                    <span class="input-group-text bg-white">
                        <i class="bi bi-person"></i>
                    </span>
          <input type="text"
                 name="username"
                 class="form-control"
                 placeholder="Enter your username"
                 required
                 autofocus
                 autocomplete="username">
        </div>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label class="form-label fw-medium">Password</label>
        <div class="input-group">
                    <span class="input-group-text bg-white">
                        <i class="bi bi-lock"></i>
                    </span>
          <input type="password"
                 name="password"
                 class="form-control"
                 placeholder="Enter your password"
                 required
                 autocomplete="current-password">
        </div>
      </div>

      <!-- Submit -->
      <div class="d-grid mt-4">
        <button type="submit" class="btn btn-primary btn-lg">
          <i class="bi bi-box-arrow-in-right"></i> Sign In
        </button>
      </div>

    </form>

    <!-- Footer -->
    <div class="text-center mt-4">
      <small class="text-muted">
        © 2026 Inventory & Billing System. All rights reserved.
      </small>
    </div>

  </div>

</div>

</body>
</html>
