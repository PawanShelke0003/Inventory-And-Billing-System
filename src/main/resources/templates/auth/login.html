<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign In | Inventory System</title>
    
    <!-- Modern Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f3f4f6;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-color: #d1d5db;
        }

        html, body {
            height: 100%;
            margin: 0;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
        }

        .page-center {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid #f1f5f9;
            animation: fadeIn 0.4s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
            box-sizing: border-box;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-container {
            width: 64px;
            height: 64px;
            background-color: #eff6ff;
            color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h3 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 8px;
            color: var(--text-main);
        }

        .login-header p {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0;
        }

        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
            display: block;
        }

        .form-control {
            width: 100%;
            height: 48px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 0 16px;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .btn-primary {
            width: 100%;
            height: 48px;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }

        .alert-danger {
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #f87171;
        }

        .alert-success {
            background-color: #f0fdf4;
            color: #166534;
            border: 1px solid #4ade80;
        }

        .footer-text {
            margin-top: 30px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="page-center">

    <div class="login-card">
        <!-- Header -->
        <div class="login-header">
            <div class="icon-container">
                <i class="bi bi-box-seam"></i>
            </div>
            <h3 th:text="${globalSettings != null ? globalSettings.storeName : 'Inventory System'}">Welcome Back</h3>
            <p>Please enter your details to sign in.</p>
        </div>

        <!-- Login Error -->
        <div th:if="${param.error}" class="alert alert-danger">
            Incorrect username or password. Please try again.
        </div>

        <!-- Logout Message -->
        <div th:if="${param.logout}" class="alert alert-success">
            You’re logged out. Please sign in again.
        </div>

        <form th:action="@{/login}" method="post">
            <!-- Username -->
            <div style="margin-bottom: 20px;">
                <label class="form-label">Username</label>
                <input type="text"
                       name="username"
                       class="form-control"
                       placeholder="Enter your username"
                       required
                       autofocus
                       autocomplete="username">
            </div>

            <!-- Password -->
            <div style="margin-bottom: 24px;">
                <label class="form-label">Password</label>
                <div style="position: relative;">
                    <input type="password"
                           id="loginPassword"
                           name="password"
                           class="form-control"
                           placeholder="Enter your password"
                           style="padding-right: 40px;"
                           required
                           autocomplete="current-password">
                    <i class="bi bi-eye-slash" style="position: absolute; right: 12px; top: 13px; cursor: pointer; font-size: 18px; color: #6b7280;" onclick="togglePasswordVisibility('loginPassword', this)"></i>
                </div>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-primary">
                Sign In <i class="bi bi-arrow-right-short" style="font-size: 20px;"></i>
            </button>
        </form>
    </div>

    <!-- Footer -->
    <div class="footer-text">
        &copy; 2026 Inventory & Billing System. All rights reserved.
    </div>

</div>

<script>
    function togglePasswordVisibility(inputId, icon) {
        var input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove("bi-eye-slash");
            icon.classList.add("bi-eye");
        } else {
            input.type = "password";
            icon.classList.remove("bi-eye");
            icon.classList.add("bi-eye-slash");
        }
    }
</script>

</body>
</html>
