<!DOCTYPE html>

      th:replace="~{admin/layout :: admin_layout('Owner Dashboard', ~{::content})}" th:with="activeMenu='dashboard'">

<div th:fragment="content">

        <div class="page-title">Owner Dashboard</div>

    </div>

    <!-- We will add the heavy analytics cards here later! -->
